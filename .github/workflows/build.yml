name: Build and test Fabric mod
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        working-directory: GenomeWorkbench
        run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: GenomeWorkbench/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: GenomeWorkbench/build/libs/*.jar
