name: Build and test Fabric mod
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        working-directory: GenomeWorkbench
        run: ./gradlew clean build --no-daemon
      - name: Check dedicated-server mod initialization
        working-directory: GenomeWorkbench
        shell: bash
        run: |
          ./gradlew runServer --args=nogui --no-daemon | tee server-bootstrap.log
          python3 -c "from pathlib import Path; assert 'Initialization Complete!' in Path('server-bootstrap.log').read_text(); assert 'eula=false' in Path('run/eula.txt').read_text()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            GenomeWorkbench/build/reports/tests/
            GenomeWorkbench/build/test-results/
            GenomeWorkbench/server-bootstrap.log
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: GenomeWorkbench/build/libs/*.jar
